name: Update WHOOP Data

# GitHub's free scheduled runners are queued at low priority — in practice this
# job has started 2–3.5 hours after its cron time, and some days not at all.
# So instead of one morning run we make several attempts across the morning:
# whichever lands first gets the day's recovery onto the dashboard, and the
# later ones refresh strain and cover a skipped run.
#
# Target: recovery on the dashboard by 7am BST. Because runs land late, the
# attempts are scheduled *earlier* than 7 — the 03:00/04:00 ones are the two
# that can realistically deliver by then. There is no point going earlier
# still: WHOOP only scores recovery once your sleep is complete, so a fetch
# before you wake just re-reads yesterday's numbers.
#
# Times are UTC (BST = UTC+1).
on:
  schedule:
    - cron: '0 3 * * *'   # 4am BST  — typically lands 5–7:30am BST
    - cron: '0 4 * * *'   # 5am BST  — typically lands 6–8:30am BST
    - cron: '0 5 * * *'   # 6am BST  — backstop
    - cron: '0 6 * * *'   # 7am BST  — the literal 7, usually lands 8–10am
    - cron: '0 16 * * *'  # 5pm BST  — refreshes the day's strain
  workflow_dispatch:      # allow manual trigger

# Runs must never overlap: WHOOP refresh tokens are single-use, so two jobs
# refreshing at once would invalidate each other's token.
concurrency:
  group: whoop-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Fetch WHOOP data
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          WHOOP_TOKEN_KEY: ${{ secrets.WHOOP_TOKEN_KEY }}
        run: python3 update_whoop.py

      - name: Commit updated data
        if: always()  # persist the rotated token even if the data fetch failed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data.json
          git add .whoop_token.enc 2>/dev/null || true
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "Update WHOOP data"
          # The rotated token only survives if this push lands, so retry on a
          # race with another commit rather than losing it.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed — rebasing and retrying ($i/3)"
            git pull --rebase origin master || git rebase --abort || true
            sleep 5
          done
          echo "could not push after 3 attempts" >&2
          exit 1
