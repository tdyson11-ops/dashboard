<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Thomas Dyson · Cyden Homes</title>
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Card">

  <style>
    /* Fully offline: no web fonts, logo and QR are embedded below. Contact
       details come from tools/make_card.py (contact.vcf / card-qr.svg) - if
       they change, rebuild the QR and re-embed it here. */
    :root { --bg: #0d0d0d; --ink: #111; --ink-soft: #5b5b5b; --brand: #153b64; --gold: #b8963f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; max-width: 430px; margin: 0 auto;
      padding: calc(1.25rem + env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom));
    }
    .card {
      background: #fff; border-radius: 14px; aspect-ratio: 85 / 55;
      padding: 7% 7.5%; display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .brand { display: flex; align-items: center; justify-content: space-between; min-height: 2.2rem; }
    .brand img { height: 4.2rem; width: auto; margin: -0.6rem 0 -0.4rem -0.5rem; }
    .brand .site { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); text-align: right; }
    .who .name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
    .who .role { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.15rem; }
    .lines { font-size: 0.78rem; line-height: 1.55; border-top: 1px solid #e6e6e6; padding-top: 0.5rem; }
    .lines a { color: inherit; text-decoration: none; }
    .lines .k { display: inline-block; width: 1.1rem; color: var(--brand); font-weight: 700; }
    .qr-wrap { margin-top: 1.1rem; background: #fff; border-radius: 14px; padding: 1.1rem; text-align: center; }
    .qr-wrap img { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; image-rendering: pixelated; }
    .qr-cap { color: var(--ink-soft); font-size: 0.78rem; margin-top: 0.5rem; }
  </style>
</head>
